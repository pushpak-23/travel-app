services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: travel_map_db_prod
    environment:
      POSTGRES_USER: ${DB_USER:-traveler}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travel123}
      POSTGRES_DB: ${DB_NAME:-travel_map_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-traveler}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel_network_prod
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    image: travel-map-backend:prod
    container_name: travel_map_api_prod
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-5000}
      DATABASE_URL: postgresql://${DB_USER:-traveler}:${DB_PASSWORD:-travel123}@postgres:5432/${DB_NAME:-travel_map_db}
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travel_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health', (r) => { r.resume(); process.exit(r.statusCode===200?0:1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: prod
    image: travel-map-frontend:prod
    container_name: travel_map_app_prod
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - travel_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://' + process.env.HOSTNAME + ':3000', (r) => { r.resume(); process.exit(r.statusCode===200?0:1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_prod:
    driver: local

networks:
  travel_network_prod:
    driver: bridge
