version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: travel_map_db_prod
    environment:
      POSTGRES_USER: traveler
      POSTGRES_PASSWORD: travel123
      POSTGRES_DB: travel_map_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveler"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: travel_map_api_prod
    environment:
      DATABASE_URL: postgresql://traveler:travel123@postgres:5432/travel_map_db
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: travel_map_app_prod
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data_prod:

networks:
  default:
    name: travel_map_network_prod
