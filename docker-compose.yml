version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: travel_map_db
    environment:
      POSTGRES_USER: ${DB_USER:-traveler}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travel123}
      POSTGRES_DB: ${DB_NAME:-travel_map_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-traveler}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    container_name: travel_map_api
    environment:
      DATABASE_URL: postgresql://${DB_USER:-traveler}:${DB_PASSWORD:-travel123}@postgres:5432/${DB_NAME:-travel_map_db}
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-5000}
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - travel_network
    restart: unless-stopped
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: travel_map_app
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - travel_network
    restart: unless-stopped
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  travel_network:
    driver: bridge
